<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM Control Panel</title>
  <link rel="stylesheet" href="/nprogress/nprogress.css" />
  <link rel="stylesheet" href="/styles/styles.css" />
</head>
<body class="control">
  <header>
    <div class="header-top">
      <h1>🐉 DM Control Panel</h1>
      <div class="connection">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">Connecting...</span>
      </div>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search..." autocomplete="off" />
  </div>

  <div class="current-preview empty" id="current-preview">
    <img id="preview-img" src="" alt="" />
    <div class="info">
      <div class="label">Now Showing</div>
      <div class="name" id="preview-name">Nothing selected</div>
    </div>
  </div>

  <div class="selected-list" id="selected-list">
    <div class="selected-header">
      <div class="label">Selected Encounter</div>
      <button class="btn-refresh" id="btn-refresh" title="Reload images">⟳ Refresh</button>
      <button class="btn-clear-selection" id="btn-clear-selection" title="Clear selection">✕ Clear</button>
    </div>
    <div class="selected-items" id="selected-items">(No monsters selected)</div>
  </div>

  <div class="item-grid" id="item-grid"></div>

  <div class="empty-state" id="empty-state" style="display:none">
    <div class="icon">📂</div>
    <p>No monster images found.<br>
      Drop image files into the <code>monsters/</code> folder and click <strong>⟳ Refresh</strong>.<br><br>
      Supports: PNG, JPG, GIF, WebP, SVG<br>
      Use subfolders to organise by type!</p>
  </div>

  <div class="play-bar">
    <label class="mode-switch">
      <span class="toggle-switch">
        <input type="checkbox" id="mode-toggle" checked />
        <span class="toggle-slider"></span>
      </span>
      <span class="mode-label" id="mode-toggle-label">Encounter</span>
    </label>

    <div class="play-controls">
      <button class="btn-nav" id="btn-prev" title="Previous slide">⏮</button>
      <button class="btn-playpause" id="btn-playpause" title="Play/Pause">▶</button>
      <button class="btn-nav" id="btn-next" title="Next slide">⏭</button>
    </div>

    <label class="duration-label">
      <input id="slide-duration" type="number" min="1" step="1" value="5" title="Seconds per slide" />
      <span>sec/slide</span>
    </label>

    <label class="kb-toggle">
      <input type="checkbox" id="kb-toggle" />
      Moving Slide
    </label>
  </div>

  <script src="/nprogress/nprogress.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/control.js"></script>
</body>
</html>
