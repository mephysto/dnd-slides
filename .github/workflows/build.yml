name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        run: npm run dist -- --mac

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DnD-Slides-macOS
          path: dist/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist -- --win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DnD-Slides-Windows
          path: dist/*.exe
          retention-days: 30
