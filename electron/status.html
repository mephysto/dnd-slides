<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D&D Slides</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 28px 24px 24px;
      -webkit-user-select: none;
      user-select: none;
    }

    h1 {
      font-size: 1.4rem;
      color: #c9a84c;
      margin-bottom: 8px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      font-size: 0.85rem;
      color: #6dbf6d;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6dbf6d;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    .rows { display: flex; flex-direction: column; gap: 12px; }

    .row { display: flex; flex-direction: column; gap: 4px; }

    .row-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #888;
    }

    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .url-value {
      flex: 1;
      min-width: 0;
      background: #2a2a4a;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #a0c4ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open-btn {
      flex-shrink: 0;
      background: #2a2a4a;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      padding: 9px 12px;
      color: #a0c4ff;
      cursor: pointer;
      transition: background 0.15s;
      line-height: 1;
      font-size: 1rem;
    }

    .open-btn:hover { background: #363660; }

    .divider {
      margin: 18px 0;
      border: none;
      border-top: 1px solid #2a2a4a;
    }

    .folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .folder-path {
      flex: 1;
      min-width: 0;
      background: #2a2a4a;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 0.8rem;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }

    .folder-path.chosen { color: #a0c4ff; }

    .choose-btn {
      flex-shrink: 0;
      background: #2a2a4a;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 0.8rem;
      color: #c9a84c;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .choose-btn:hover { background: #363660; }
    .choose-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <h1>🐉 D&amp;D Slides</h1>

  <div class="status">
    <div class="dot"></div>
    Server running
  </div>

  <div class="rows">
    <div class="row">
      <div class="row-label">DM Control Panel — open on your phone</div>
      <div class="url-row">
        <div class="url-value" id="dm-url"></div>
        <button class="open-btn" id="open-dm" title="Open in browser">&#x2197;</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">TV Display — open in a browser on the TV/PC</div>
      <div class="url-row">
        <div class="url-value" id="display-url"></div>
        <button class="open-btn" id="open-display" title="Open in browser">&#x2197;</button>
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="rows">
    <div class="row">
      <div class="row-label">Monsters folder</div>
      <div class="folder-row">
        <div class="folder-path" id="monsters-path">Not set</div>
        <button class="choose-btn" id="choose-monsters">Choose…</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">Environments folder</div>
      <div class="folder-row">
        <div class="folder-path" id="environments-path">Not set</div>
        <button class="choose-btn" id="choose-environments">Choose…</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ip   = params.get("ip");
    const port = params.get("port");

    const dmUrl      = `http://${ip}:${port}/dm`;
    const displayUrl = `http://${ip}:${port}/`;

    document.getElementById("dm-url").textContent      = dmUrl;
    document.getElementById("display-url").textContent = displayUrl;

    document.getElementById("open-dm").addEventListener("click", () => {
      window.open(dmUrl, "_blank");
    });
    document.getElementById("open-display").addEventListener("click", () => {
      window.open(displayUrl, "_blank");
    });

    function setPath(elId, value) {
      const el = document.getElementById(elId);
      if (value) {
        el.textContent = value;
        el.classList.add("chosen");
      } else {
        el.textContent = "Not set";
        el.classList.remove("chosen");
      }
    }

    setPath("monsters-path", params.get("monstersDir"));
    setPath("environments-path", params.get("environmentsDir"));

    async function pickFolder(type, pathElId, btnEl) {
      btnEl.disabled = true;
      try {
        const chosen = await window.electronAPI.chooseFolder(type);
        if (chosen) setPath(pathElId, chosen);
      } finally {
        btnEl.disabled = false;
      }
    }

    document.getElementById("choose-monsters").addEventListener("click", (e) => {
      pickFolder("monsters", "monsters-path", e.currentTarget);
    });

    document.getElementById("choose-environments").addEventListener("click", (e) => {
      pickFolder("environments", "environments-path", e.currentTarget);
    });
  </script>
</body>
</html>
